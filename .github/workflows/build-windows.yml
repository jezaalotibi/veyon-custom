name: "Build Custom Windows Setup"

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-httpserver
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qca-qt6
            mingw-w64-x86_64-libvncserver
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-openldap
            mingw-w64-x86_64-cyrus-sasl
            mingw-w64-x86_64-nsis
            dos2unix

      - name: Build Windows Installer
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja
          cd ..
          bash package-windows.sh
          ls -la *.exe build/*.exe 2>/dev/null || true

      - name: Upload Installer Setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veyon-custom-win64-setup
          path: |
            *.exe
            build/*.exe
