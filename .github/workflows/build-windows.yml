name: "Build Custom Windows Setup"

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    container: fedora:42
    steps:
      - name: Install Fedora MinGW Toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git ninja-build cmake gcc gcc-c++ \
            mingw64-gcc mingw64-gcc-c++ mingw64-binutils \
            mingw64-qt6-qtbase mingw64-qt6-qtbase-devel mingw64-qt6-qt5compat \
            mingw64-qt6-qttools-tools \
            mingw64-openssl mingw64-libvncserver mingw64-zlib \
            mingw64-libpng mingw64-libjpeg-turbo mingw64-lzo \
            mingw64-nsis nsis dos2unix findutils

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Windows Installer
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .ci/windows/build.sh x86_64

      - name: Upload Installer Setup
        uses: actions/upload-artifact@v4
        with:
          name: veyon-custom-win64-setup
          path: |
            veyon-*.exe
            veyon-*win64*
