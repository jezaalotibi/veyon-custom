name: "Build Custom Windows Setup"

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qca-qt6
            mingw-w64-x86_64-libvncserver
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-nsis

      - name: Build Windows Installer
        shell: msys2 {0}
        run: |
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja create-windows-installer || ninja windows-binaries
          cp -f veyon-*.exe .. 2>/dev/null || true
          cp -f */veyon-*.exe .. 2>/dev/null || true

      - name: Upload Installer Setup
        uses: actions/upload-artifact@v4
        with:
          name: veyon-custom-win64-setup
          path: |
            veyon-*.exe
            build/veyon-*.exe
